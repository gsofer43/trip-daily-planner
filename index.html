<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתכנן מסלול טיול</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>

<header class="app-header">
  <div class="header-titles">
    <h1 id="tripTitle">מסלול טיול: מונטנגרו ואלבניה</h1>
    <p class="subtitle">ספטמבר – אוקטובר</p>
  </div>
  <div class="header-actions">
    <button id="overviewMapBtn" class="btn btn-ghost" title="הצגת כל המסלול על מפה אחת">🗺️ מפת מסלול מלא</button>
    <button id="wineriesBtn" class="btn btn-ghost" title="יקבים מומלצים לאורך המסלול">🍷 יקבים מומלצים</button>
    <button id="hotelsBtn" class="btn btn-ghost" title="מלונות מומלצים לאורך המסלול">🏨 מלונות מומלצים</button>
    <button id="exportBtn" class="btn btn-ghost" title="שמירת גיבוי כקובץ JSON">⬇️ גיבוי</button>
    <label class="btn btn-ghost file-label" title="טעינת גיבוי מקובץ JSON">
      ⬆️ שחזור
      <input type="file" id="importInput" accept="application/json" hidden>
    </label>
    <button id="resetBtn" class="btn btn-ghost danger" title="מחיקת הכל וחזרה למסלול הלדוגמה">↺ איפוס</button>
  </div>
</header>

<div class="hero">
  <a class="hero-credit" href="https://commons.wikimedia.org/wiki/File:Bay_of_Kotor_Panorama.jpg" target="_blank" rel="noopener noreferrer">צילום: Fromaage · CC BY-SA, Wikimedia Commons</a>
</div>

<div class="tabs-row">
  <nav id="dayTabs" class="day-tabs"></nav>
  <button id="addDayBtn" class="btn btn-add-day">+ יום</button>
</div>

<main id="dayContent" class="day-content"></main>

<section id="overviewMapSection" class="overview-map-section hidden">
  <div class="overview-map-header">
    <div class="map-section-title">🗺️ מפת המסלול המלא</div>
    <button id="closeOverviewBtn" class="btn btn-ghost">✕ חזרה לימים</button>
  </div>
  <div id="overviewMap" class="overview-map"></div>
</section>

<section id="wineriesSection" class="overview-map-section hidden">
  <div class="overview-map-header">
    <div class="map-section-title">🍷 יקבים מומלצים</div>
    <button id="closeWineriesBtn" class="btn btn-ghost">✕ חזרה לימים</button>
  </div>
  <div id="wineriesList" class="place-list"></div>
</section>

<section id="hotelsSection" class="overview-map-section hidden">
  <div class="overview-map-header">
    <div class="map-section-title">🏨 מלונות מומלצים</div>
    <button id="closeHotelsBtn" class="btn btn-ghost">✕ חזרה לימים</button>
  </div>
  <div id="hotelsList" class="place-list"></div>
</section>

<template id="emptyDaysTemplate">
  <div class="empty-state">
    <p>אין עדיין ימים במסלול.</p>
    <button class="btn btn-primary" id="emptyAddDayBtn">הוספת יום ראשון</button>
  </div>
</template>

<!-- Stop (station) add/edit modal -->
<div id="stopModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="stopModalTitle">הוספת תחנה</h2>
    <form id="stopForm">
      <label>
        שעה משוערת
        <input type="time" id="stopTime" required>
      </label>
      <label>
        חיפוש מקום (למילוי אוטומטי של שם וקואורדינטות)
        <div class="place-search-wrap">
          <input type="text" id="stopSearchInput" placeholder="לדוגמה: Budva, Montenegro" autocomplete="off">
          <ul id="stopSearchResults" class="search-results hidden"></ul>
        </div>
      </label>
      <label>
        שם המקום
        <input type="text" id="stopPlace" required placeholder="לדוגמה: מבצר רוזאפה">
      </label>
      <label>
        הערה קצרה
        <textarea id="stopNote" rows="2" placeholder="פרטים נוספים, טיפים, כתובת..."></textarea>
      </label>
      <label>
        קואורדינטות (לא חובה — מתמלא אוטומטית מהחיפוש למעלה, או הזינו ידנית)
        <input type="text" id="stopCoords" placeholder="42.4247, 18.7712">
        <small class="field-hint">גיבוי ידני: מגוגל מפות — קליק ימני על המקום ← "מה יש כאן?" / העתקת הקואורדינטות</small>
      </label>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" id="cancelStopBtn" class="btn btn-ghost">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Day add/edit modal -->
<div id="dayModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="dayModalTitle">יום חדש</h2>
    <form id="dayForm">
      <label>
        כותרת היום
        <input type="text" id="dayTitleInput" required placeholder="לדוגמה: טיראנה">
      </label>
      <label>
        תאריך
        <input type="text" id="dayDateInput" placeholder="לדוגמה: 19/09">
      </label>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" id="cancelDayBtn" class="btn btn-ghost">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Place info modal (Wikipedia) -->
<div id="infoModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="infoModalTitle"></h2>
    <img id="infoModalImage" class="info-modal-image hidden" alt="">
    <p id="infoModalExtract" class="info-modal-extract"></p>
    <div class="modal-actions">
      <a id="infoModalLink" class="btn btn-ghost hidden" target="_blank" rel="noopener noreferrer">קריאה נוספת בוויקיפדיה ↗</a>
      <button type="button" id="closeInfoBtn" class="btn btn-primary">סגירה</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
